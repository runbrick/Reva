name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-amd64 }
          - { os: macos-15, platform: darwin-amd64 }
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check source
        shell: pwsh
        run: |
          if (gofmt -l .) { throw 'gofmt reported unformatted files' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          go tool viva vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Viva vet failed' }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Arch amd64
      - name: Package macOS
        if: runner.os == 'macOS'
        run: sh ./scripts/build.sh amd64
      - uses: actions/upload-artifact@v4
        with:
          name: reva-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/reva-*.zip
            dist/${{ matrix.platform }}/reva-*-setup.exe
            dist/${{ matrix.platform }}/reva-*.dmg
          if-no-files-found: error
