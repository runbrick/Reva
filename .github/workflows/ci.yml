name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Use LF line endings for gofmt on every runner
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Check gofmt
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed." }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Output
            throw "Run gofmt on the files above."
          }
      - name: Go vet
        run: go vet ./...
      - name: Viva vet
        run: go tool viva vet ./...
      - name: Tests
        run: go test ./... -count=1
      - name: Windows release, package and 15 MB limit
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: macOS release, bundle, DMG and 15 MB limit
        if: runner.os == 'macOS'
        run: sh ./scripts/build.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reqo-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/**/*.zip
            dist/**/*.dmg
          if-no-files-found: error
